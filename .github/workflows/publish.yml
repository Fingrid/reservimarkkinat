name: publish-to-github-pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: enable corepack and set pnpm version to latest stable
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          always-auth: true
          node-version: 24
          registry-url: https://pkgs.dev.azure.com/fingrid/Ohjelmistokehitys/_packaging/fingrid-npm/npm/registry/
          scope: "@fingrid"
      - name: Setup Pages
        uses: actions/configure-pages@v6
        #with: // Still fails - this time due to type error
        #  static_site_generator: next
      - name: Build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADO_PAT }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          touch ./out/.nojekyll # Prevent Jekyll from processing the site
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
